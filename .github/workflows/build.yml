name: Build Windows EXE & Linux ARM64

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0) - leave blank to only build artifacts'
        required: false
        default: ''

jobs:
  build-windows-exe:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nuitka

      - name: Compile Proprietary Modules with Nuitka (C++ Binary Protection)
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/compile_nuitka.py

      - name: Build Windows Executable
        run: pyinstaller BillScrapper.spec --clean

      - name: Build Windows Setup Installer (Inno Setup)
        run: |
          $ver = "${{ github.ref_type == 'tag' && github.ref_name || '1.2.0' }}".TrimStart("v")
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccCmd) {
              $isccPath = $isccCmd.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          } else {
              choco install innosetup --no-progress -y
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          }
          & $isccPath "/DAppVersion=$ver" installer.iss

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillScrapper-Windows-Setup
          path: dist/BillScrapper-Setup.exe

  build-windows-7:
    name: Build Windows 7 / Legacy (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8 (32-bit x86 for max Windows 7 compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Set up MSVC Environment (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nuitka

      - name: Compile Proprietary Modules with Nuitka (C++ Binary Protection)
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/compile_nuitka.py

      - name: Build Windows Executable
        run: pyinstaller BillScrapper.spec --clean

      - name: Download VC++ 2015-2022 Redistributable (x86) for bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path redist
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x86.exe" -OutFile "redist/vc_redist.x86.exe"

      - name: Build Windows 7 Setup Installer (Inno Setup)
        run: |
          $ver = "${{ github.ref_type == 'tag' && github.ref_name || '1.2.0' }}".TrimStart("v")
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccCmd) {
              $isccPath = $isccCmd.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          } else {
              choco install innosetup --no-progress -y
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          }
          & $isccPath "/DAppVersion=$ver" "/DOutputBaseFilename=BillScrapper-Win7-Setup" "/DIncludeVCRedist=1" installer.iss

      - name: Upload Windows 7 Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillScrapper-Windows7-Setup
          path: dist/BillScrapper-Win7-Setup.exe

  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk binutils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Linux ARM64 Binary
        run: pyinstaller BillScrapper.spec --clean

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillScrapper-Linux-ARM64
          path: dist/BillScrapper

  release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-windows-7, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Download Windows Setup Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: BillScrapper-Windows-Setup
          path: release-assets/

      - name: Download Windows 7 Setup Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: BillScrapper-Windows7-Setup
          path: release-assets/

      - name: Download Linux ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: BillScrapper-Linux-ARM64
          path: release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          files: |
            release-assets/BillScrapper-Setup.exe
            release-assets/BillScrapper-Win7-Setup.exe
            release-assets/BillScrapper
          draft: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

