name: Build Windows EXE & Linux ARM64

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0) - leave blank to only build artifacts'
        required: false
        default: ''

jobs:
  build-windows-exe:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka zstandard

      - name: Build Windows Executable (Nuitka C-Compilation)
        run: |
          nuitka --standalone --onefile \
            --assume-yes-for-downloads \
            --windows-console-mode=disable \
            --enable-plugin=tk-inter \
            --include-data-dir=assets=assets \
            --windows-icon-from-ico=assets/billscrapper.ico \
            --output-filename=BillScrapper.exe \
            --output-dir=dist \
            main.py

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillScrapper-Windows-exe
          path: dist/BillScrapper.exe

  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk patchelf ccache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka zstandard

      - name: Build Linux ARM64 Binary (Nuitka C-Compilation)
        run: |
          nuitka --standalone --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-data-dir=assets=assets \
            --output-filename=BillScrapper \
            --output-dir=dist \
            main.py

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillScrapper-Linux-ARM64
          path: dist/BillScrapper

  release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: BillScrapper-Windows-exe
          path: release-assets/

      - name: Download Linux ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: BillScrapper-Linux-ARM64
          path: release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          files: |
            release-assets/BillScrapper.exe
            release-assets/BillScrapper
          draft: false
          prerelease: false
          generate_release_notes: true

